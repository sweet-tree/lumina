<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina - Immersive Concept</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Georgia", serif;
        background: linear-gradient(to bottom, #faf9f6 0%, #f5f3ee 100%);
        height: 100vh;
        overflow: hidden;
      }

      /* Top whisper - barely there */
      .top-whisper {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem 2rem;
        opacity: 0.4;
        transition: opacity 0.3s;
        z-index: 10;
      }

      .top-whisper:hover {
        opacity: 1;
      }

      .lumina-word {
        font-size: 0.875rem;
        letter-spacing: 0.15em;
        color: #2d3561;
        font-weight: 300;
      }

      .avatar-hint {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #c9a969;
        opacity: 0.6;
      }

      /* The Void - main container */
      .void {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem;
      }

      /* Date - floating above */
      .date-whisper {
        position: absolute;
        top: 20%;
        font-size: 0.875rem;
        color: #6b7280;
        opacity: 0.5;
        letter-spacing: 0.05em;
      }

      /* The Sacred Space */
      .sacred-space {
        width: 100%;
        max-width: 42rem;
        min-height: 400px;
        position: relative;
      }

      .writing-surface {
        width: 100%;
        min-height: 400px;
        background: transparent;
        border: none;
        font-size: 1.25rem;
        line-height: 1.8;
        color: #1a1a1a;
        text-align: center;
        resize: none;
        outline: none;
        font-family: "Georgia", serif;
      }

      .writing-surface::placeholder {
        color: #c9a969;
        opacity: 0.3;
        font-style: italic;
      }

      /* Time navigation - appears on edges */
      .time-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: transparent;
        border: 1px solid #c9a969;
        opacity: 0.2;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2d3561;
        cursor: pointer;
      }

      .time-nav:hover {
        opacity: 1;
        background: rgba(201, 169, 105, 0.1);
      }

      .time-nav.prev {
        left: -80px;
      }

      .time-nav.next {
        right: -80px;
      }

      /* Bottom hint - keyboard shortcuts */
      .bottom-whisper {
        position: absolute;
        bottom: 2rem;
        font-size: 0.75rem;
        color: #6b7280;
        opacity: 0.3;
        letter-spacing: 0.1em;
      }

      /* Floating indicators */
      .indicators {
        position: absolute;
        bottom: -60px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 0.5rem;
        opacity: 0.4;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #c9a969;
        transition: all 0.3s;
      }

      .dot.filled {
        background: #2d3561;
        transform: scale(1.5);
      }

      .dot.current {
        background: #c9a969;
        transform: scale(1.8);
        box-shadow: 0 0 8px rgba(201, 169, 105, 0.6);
      }

      /* Annotation labels */
      .annotation {
        position: absolute;
        font-size: 0.75rem;
        color: #c9a969;
        font-family: sans-serif;
        background: white;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        border: 1px dashed #c9a969;
        white-space: nowrap;
      }

      .ann1 {
        top: 1rem;
        right: 1rem;
      }
      .ann2 {
        top: 18%;
        right: 2rem;
      }
      .ann3 {
        left: 50%;
        bottom: 35%;
        transform: translateX(-50%);
      }
      .ann4 {
        bottom: 8rem;
        left: 2rem;
      }
      .ann5 {
        left: -140px;
        top: 45%;
      }
      .ann6 {
        right: -140px;
        top: 45%;
      }
    </style>
  </head>
  <body>
    <!-- Top whisper -->
    <div class="top-whisper">
      <div class="lumina-word">LUMINA</div>
      <div class="avatar-hint"></div>
    </div>

    <!-- Annotations -->
    <div class="annotation ann1">↑ Fades unless hovered</div>
    <div class="annotation ann2">↓ Date whispers</div>
    <div class="annotation ann3">⬇ Pure void - just you and words</div>
    <div class="annotation ann4">⬇ Dots for last 7 days</div>
    <div class="annotation ann5">← Time flows</div>
    <div class="annotation ann6">Time flows →</div>

    <!-- The Void -->
    <div class="void">
      <!-- Date whisper -->
      <div class="date-whisper">October 14, 2025</div>

      <!-- Sacred Space -->
      <div class="sacred-space">
        <!-- Time navigation -->
        <div class="time-nav prev">‹</div>
        <div class="time-nav next">›</div>

        <!-- Writing surface -->
        <textarea
          class="writing-surface"
          placeholder="How are you feeling right now?"
        ></textarea>

        <!-- Day indicators -->
        <div class="indicators">
          <div class="dot filled"></div>
          <div class="dot filled"></div>
          <div class="dot"></div>
          <div class="dot filled"></div>
          <div class="dot current"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <!-- Bottom whisper -->
      <div class="bottom-whisper">
        press 'c' for calendar · '/' to search · scroll for memories
      </div>
    </div>
  </body>
</html>
